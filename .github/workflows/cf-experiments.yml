name: Cloudflare experiments

on:
  push:
    paths:
    - experiments/**
    - .github/workflows/cf-experiments.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: flaresolverr-session
          install: pip install curl_cffi && docker run -d --name flaresolverr -p 8191:8191 -e LOG_LEVEL=info ghcr.io/flaresolverr/flaresolverr:latest
          run: python experiments/probe.py flaresolverr_session; docker logs flaresolverr 2>&1 | tail -30
        - name: nodriver-headful-a
          install: pip install nodriver curl_cffi opencv-python-headless
          run: xvfb-run -a -s "-screen 0 1920x1080x24" python experiments/probe.py nodriver headful
        - name: nodriver-headful-b
          install: pip install nodriver curl_cffi opencv-python-headless
          run: xvfb-run -a -s "-screen 0 1920x1080x24" python experiments/probe.py nodriver headful
        - name: nodriver-headful-c
          install: pip install nodriver curl_cffi opencv-python-headless
          run: xvfb-run -a -s "-screen 0 1920x1080x24" python experiments/probe.py nodriver headful
        - name: camoufox
          install: pip install 'camoufox[geoip]' && python -m camoufox fetch
          run: python experiments/probe.py camoufox
    name: ${{ matrix.name }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install
      if: ${{ matrix.install != '' }}
      run: ${{ matrix.install }}
    - name: Probe
      run: ${{ matrix.run }}
    - name: Upload output
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: probe-${{ matrix.name }}
        path: probe-out/
        if-no-files-found: ignore
